function viewDiag(){
  if(!S.machine){
    return `<div class="fade"><h2 class="text-xl font-bold mb-1">¿Qué máquina usas?</h2>
      <p class="text-sm text-stone-500 mb-4">Paso 1 de 3</p>
      <div class="grid grid-cols-2 gap-3">${MACHINES.map(m=>`
        <button onclick="pickMachine('${m.id}')" class="${card} p-4 text-center">
          <div class="text-5xl mb-2">${m.icon}</div><b class="block">${m.name}</b><span class="text-xs text-stone-500">${m.sub}</span>
        </button>`).join('')}</div></div>`;
  }
  const m = MACHINES.find(x=>x.id===S.machine);
  if(!S.symptom){
    return `<div class="fade"><h2 class="text-xl font-bold mb-1">¿Qué le pasa?</h2>
      <p class="text-sm text-stone-500 mb-4">Paso 2 de 3 · ${m.icon} ${m.name}</p>
      <div class="space-y-3">${SYMPTOMS.map(s=>`
        <button onclick="pickSymptom('${s.id}')" class="${card} w-full p-4 flex items-center gap-4 text-left">
          <span class="text-3xl">${s.icon}</span><b class="flex-1 text-base">${s.name}</b><span class="text-stone-400 text-2xl">›</span>
        </button>`).join('')}</div></div>`;
  }
  const node = S.path[S.path.length-1];
  if(node.r) return viewResult(node.r, m);
  const pct = Math.min(90, 40 + S.path.length*15);
  return `<div class="fade">
    <div class="h-2 rounded-full bg-stone-200 overflow-hidden mb-1"><div class="bar h-full bg-brand-600 rounded-full" style="width:${pct}%"></div></div>
    <p class="text-sm text-stone-500 mb-4">Paso 3 de 3 · ${m.icon} ${m.name}</p>
    <div class="${card} p-5 mb-4"><h2 class="text-xl font-bold leading-snug">${node.q}</h2></div>
    <div class="space-y-3">${node.opts.map((o,i)=>`
      <button onclick="answer(${i})" class="w-full rounded-2xl bg-white border-2 border-brand-600 text-brand-700 font-bold text-lg py-4 px-4 ripple elev1">${o.t}</button>`).join('')}</div>
  </div>`;
}

  const s = SEV[r.sev];
  return `<div class="fade space-y-4">
    <div class="${s.bg} border-l-8 ${s.bd} rounded-2xl p-5 elev1">
      <span class="inline-block text-xs font-bold tracking-wide ${s.tx} bg-white/70 rounded-full px-3 py-1">${s.icon} ${s.label}</span>
      <h2 class="text-xl font-bold mt-2 ${s.tx}">${r.title}</h2>
      <p class="mt-1 text-stone-700">${r.cause}</p>
    </div>
    <div class="${card.replace('ripple','')} p-5">
      <h3 class="font-bold text-lg mb-3">Qué hacer</h3>
      <ol class="space-y-3">${r.steps.map((t,i)=>`
        <li class="flex gap-3"><span class="shrink-0 w-7 h-7 rounded-full bg-brand-700 text-white text-sm font-bold flex items-center justify-center">${i+1}</span><span>${t}</span></li>`).join('')}</ol>
    </div>
    <div class="rounded-2xl bg-white p-5 elev1">
      <h3 class="font-bold">📞 ¿Llamar al mecánico?</h3><p class="text-stone-600 mt-1">${r.call}</p>
    </div>
    ${vcard('🎬','Ver videos sobre este problema',m.name+' · '+SYMPTOMS.find(s=>s.id===S.symptom).name, MSEARCH[m.id]+' '+SYMPTOMS.find(s=>s.id===S.symptom).name+' solucion')}
    <div class="rounded-2xl bg-brand-50 p-4 text-sm"><b>💡 Consejo para ${m.name}:</b> ${m.tip}</div>
    <button onclick="resetDiag()" class="w-full rounded-2xl bg-brand-700 text-white font-bold py-4 ripple elev2">Nuevo diagnóstico</button>
  </div>`;
}

function viewGuides(){
  if(!S.guide){
    return `<div class="fade"><h2 class="text-xl font-bold mb-4">Guías y tutoriales</h2><div class="space-y-3">${GUIDES.map(g=>{
      const done = g.checklist ? Object.keys(checks[g.id]||{}).filter(k=>checks[g.id][k]).length : 0;
      return `<button onclick="openGuide('${g.id}')" class="${card} w-full p-4 flex items-center gap-4 text-left">
        <span class="text-3xl">${g.icon}</span>
        <span class="flex-1"><b class="block">${g.name}</b><span class="text-xs text-stone-500">${g.steps.length} pasos · ${g.mins} min${g.checklist&&done?` · ${done}/${g.steps.length} hechos`:''}</span></span>
        <span class="text-stone-400 text-2xl">›</span></button>`}).join('')}</div></div>`;
  }
  const g = GUIDES.find(x=>x.id===S.guide);
  const c = checks[g.id]||{};
  const done = g.steps.filter((_,i)=>c[i]).length;
  const pct = Math.round(done/g.steps.length*100);
  return `<div class="fade">
    <div class="flex items-center gap-3 mb-3"><span class="text-4xl">${g.icon}</span><h2 class="text-xl font-bold">${g.name}</h2></div>
    <div class="h-2 rounded-full bg-stone-200 overflow-hidden"><div class="bar h-full bg-emerald-500 rounded-full" style="width:${pct}%"></div></div>
    <p class="text-sm text-stone-500 mt-1 mb-4">${done} de ${g.steps.length} pasos · toca cada paso al completarlo</p>
    <div class="space-y-2">${g.steps.map((t,i)=>`
      <button onclick="toggle('${g.id}',${i})" class="w-full flex items-start gap-3 text-left p-4 rounded-2xl ripple elev1 ${c[i]?'bg-emerald-50':'bg-white'}">
        <span class="shrink-0 w-7 h-7 rounded-full border-2 flex items-center justify-center text-sm font-bold ${c[i]?'bg-emerald-500 border-emerald-500 text-white':'border-stone-300 text-stone-400'}">${c[i]?'✓':i+1}</span>
        <span class="${c[i]?'line-through text-stone-500':''}">${t}</span>
      </button>`).join('')}</div>
    ${pct===100?`<div class="mt-4 p-4 rounded-2xl bg-emerald-100 text-emerald-900 text-center font-bold fade">🎉 ¡Guía completada!</div>`:''}
    <div class="mt-4">${vcard('🎬','Ver video de esta guía',g.name,GUIDE_VQ[g.id])}</div>
    <button onclick="resetGuide('${g.id}')" class="mt-4 w-full rounded-2xl border-2 border-stone-300 text-stone-600 font-medium py-3 ripple">Reiniciar</button>
  </div>`;
}

function viewVideos(){
  return `<div class="fade"><h2 class="text-xl font-bold mb-1">Videos</h2>
    <p class="text-sm text-stone-500 mb-4">Se abren en YouTube. Necesitas internet.</p>
    <div class="space-y-3">${VIDEOS.map(v=>vcard(v.icon,v.title,v.sub,v.q)).join('')}</div></div>`;
}

function viewQuiz(){
  const q = S.q;
  if(q.done){
    const pct = q.score/QUIZ.length;
    return `<div class="fade text-center space-y-4 pt-6">
      <div class="text-7xl">${pct>=.8?'🏆':pct>=.5?'👍':'📖'}</div>
      <h2 class="text-2xl font-bold">${q.score} de ${QUIZ.length} correctas</h2>
      <p class="text-stone-600">${pct>=.8?'¡Excelente! Eres un operador seguro.':pct>=.5?'Bien, pero repasa las guías.':'Revisa las guías y vuelve a intentar.'}</p>
      <button onclick="resetQuiz()" class="w-full rounded-2xl bg-brand-700 text-white font-bold py-4 ripple elev2">Intentar de nuevo</button>
      <button onclick="go('guides')" class="w-full rounded-2xl border-2 border-brand-600 text-brand-700 font-bold py-3 ripple">Ir a las guías</button>
    </div>`;
  }
  const item = QUIZ[q.i];
  return `<div class="fade">
    <div class="h-2 rounded-full bg-stone-200 overflow-hidden mb-1"><div class="bar h-full bg-brand-600 rounded-full" style="width:${q.i/QUIZ.length*100}%"></div></div>
    <p class="text-sm text-stone-500 mb-4">Pregunta ${q.i+1} de ${QUIZ.length}</p>
    <div class="${card.replace('ripple','')} p-5 mb-4"><h2 class="text-xl font-bold leading-snug">${item.q}</h2></div>
    <div class="space-y-3">${item.o.map((t,i)=>{
      let cls='bg-white border-stone-300';
      if(q.picked!==null){ if(i===item.a) cls='bg-emerald-100 border-emerald-500'; else if(i===q.picked) cls='bg-red-100 border-red-500'; }
      return `<button ${q.picked!==null?'disabled':''} onclick="pick(${i})" class="w-full rounded-2xl border-2 ${cls} text-left font-medium text-lg py-4 px-4 ripple elev1">${t}</button>`}).join('')}</div>
    ${q.picked!==null?`<div class="mt-4 p-4 rounded-2xl bg-brand-50 text-sm fade"><b>${q.picked===item.a?'✅ ¡Correcto!':'❌ Incorrecto.'}</b> ${item.why}</div>
      <button onclick="nextQ()" class="mt-4 w-full rounded-2xl bg-brand-700 text-white font-bold py-4 ripple elev2">${q.i===QUIZ.length-1?'Ver resultado':'Siguiente'}</button>`:''}
  </div>`;
}

/* ---------- RENDER ---------- */
const TABS = [['home','🏠','Inicio'],['diag','🩺','Diagnóstico'],['guides','📚','Guías'],['videos','🎬','Videos'],['quiz','🎯','Quiz']];
const TITLES = {home:'Asistente de Campo',diag:'Diagnóstico',guides:'Guías',videos:'Videos',quiz:'Quiz de seguridad'};

function render(){
  const views = {home:viewHome,diag:viewDiag,guides:viewGuides,videos:viewVideos,quiz:viewQuiz};
  $('app').innerHTML = views[S.tab]();
  $('nav').innerHTML = TABS.map(([id,ic,l])=>`
    <button onclick="go('${id}')" class="py-2 flex flex-col items-center gap-0.5 ripple">
      <span class="px-4 py-1 rounded-full text-xl ${S.tab===id?'bg-brand-100':''}">${ic}</span>
      <span class="text-xs ${S.tab===id?'font-bold text-brand-700':'text-stone-500'}">${l}</span>
    </button>`).join('');
  $('title').textContent = TITLES[S.tab];
  const deep = (S.tab==='diag'&&S.machine) || (S.tab==='guides'&&S.guide);
  $('back').classList.toggle('hidden', !deep);
  window.scrollTo(0,0);
}
function $(id){ return document.getElementById(id); }

/* ---------- ACCIONES ---------- */
function go(t){ S.tab=t; if(t==='diag') resetDiag(true); if(t==='guides') S.guide=null; if(t==='quiz') resetQuiz(true); render(); }
function resetDiag(silent){ S.machine=null; S.symptom=null; S.path=[]; if(!silent) render(); }
function pickMachine(id){ S.machine=id; render(); }
function pickSymptom(id){ S.symptom=id; S.path=[SYMPTOMS.find(s=>s.id===id).tree]; render(); }
function answer(i){ const n=S.path[S.path.length-1]; S.path.push(n.opts[i].next); render(); }
function openGuide(id){ S.guide=id; render(); }
function toggle(g,i){ checks[g]=checks[g]||{}; checks[g][i]=!checks[g][i]; saveChecks(); const y=window.scrollY; render(); window.scrollTo(0,y); }
function resetGuide(g){ checks[g]={}; saveChecks(); render(); }
function startSOS(){ S.tab='guides'; S.guide='emerg'; render(); }
function resetQuiz(silent){ S.q={i:0,score:0,picked:null,done:false}; if(!silent) render(); }
function pick(i){ if(S.q.picked!==null) return; S.q.picked=i; if(i===QUIZ[S.q.i].a) S.q.score++; render(); }
function nextQ(){ if(S.q.i===QUIZ.length-1) S.q.done=true; else { S.q.i++; S.q.picked=null; } render(); }

function goBack(){
  if(S.tab==='guides'){ S.guide=null; }
  else if(S.tab==='diag'){
    if(S.path.length>1) S.path.pop();
    else if(S.symptom){ S.symptom=null; S.path=[]; }
    else S.machine=null;
  }
  render();
}
// botón atrás de Android
history.pushState({}, '');
window.addEventListener('popstate', ()=>{ history.pushState({}, ''); if(!$('back').classList.contains('hidden')) goBack(); else if(S.tab!=='home') go('home'); });

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
